<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      @import url("https://2plus2isfive.github.io/css/reset.css");
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap");
      html,
      body {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        color: #fff;
        overscroll-behavior: none;
        display: flex;
        flex-direction: column;
      }
      .page {
        width: 100%;
        height: 100vh;
        position: relative;
      }
      .bg {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-size: cover;
        background-position: center;
        filter: brightness(50%);
      }
      .bg__gradient {
        background: linear-gradient(to top, #000000aa, transparent, transparent);
        width: 100%;
        height: 100%;
      }
      #pg01 {
      }
      .pg02 {
      }
      #pg03 {
      }
      h1 {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: end;
        align-items: start;
        font-size: 6vw;
        font-weight: 600;
        filter: drop-shadow(2px 2px 0 #000);
        font-family: "IBM Plex Mono";
        flex-direction: column;
        padding: 0 0 0 4%;
      }
      .by_me {
        font-size: 2vw;
        font-weight: 400;
        padding: 12px 0 4% 1%;
      }
      .content {
        padding: 4%;
        text-shadow: 1px 1px 0 #000, 0 0 2px #000;
        font-size: 24px;
        line-height: 1.3;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tropical Rainforest</title>
  </head>
  <body>
    <div class="page pg01">
      <div class="bg" style="background-image: url('aerial.jpg')">
        <div class="bg__gradient"></div>
      </div>
      <h1>Tropical Rainforest<br /><span class="by_me">by Parker</span></h1>
    </div>
    <div class="page pg02">
      <div class="bg" style="background-image: url('river.jpg')"></div>
      <div class="content">Tropical Rainforest is in South America and Central Asia.</div>
    </div>
    <div class="page pg03">
      <div class="bg" style="background-image: url('fog.jpg')"></div>
      <div class="content">Tropical Rainforests have very strange weather.</div>
    </div>
  </body>
</html>
